<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="canonical" href="https://velez-elecciones.vercel.app/">
    <link rel="icon" href="img/escudo-velez.svg" type="image/svg+xml">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="Elecciones Vélez 2026: candidatos, noticias y sondeos">
    <meta property="og:description" content="Leé qué dijo cada candidato, con la fuente, y seguí las noticias y los sondeos de la elección.">
    <meta property="og:type" content="website">

    <meta name="twitter:image:alt" content="Elecciones Vélez 2026: candidatos, noticias y sondeos. Domingo 15 de noviembre.">
    <meta name="theme-color" content="#003da5">

    <style>
        :root {
            --blue: #003da5;
            --blue-soft: #1a8fe8;
            --ink: #10203a;
            --muted: #5a6b85;
            --line: rgba(0, 61, 165, .12);
            --paper: #ffffff;
            --wash: #f3f7fc;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            color: var(--ink);
            background-color: #001433;
            background-image:
                linear-gradient(180deg, rgba(0, 28, 92, .62), rgba(0, 16, 58, .78)),
                url("img/fondo-amalfitani.jpg");
            background-size: auto, cover;
            background-position: center, center top;
            background-attachment: fixed, fixed;
            background-repeat: no-repeat;
            overflow-x: clip;
        }
        a { color: inherit; }
        h1, h2, h3, h4, p { margin: 0; }
        .hidden { display: none !important; }
        .no-select { -webkit-user-select: none; user-select: none; }
        button { font: inherit; }

        /* Iconos de contorno: toman el color del texto (blanco sobre azul, azul sobre blanco) */
        .ic { width: 1.2em; height: 1.2em; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }

        .page { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }

        /* Cabecera fija: título, marcador en negativo y fecha */
        .top {
            position: sticky; top: 0; z-index: 30;
            display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap;
            padding: 12px 24px;
            background: var(--blue);
            color: #fff;
            box-shadow: 0 8px 22px rgba(0, 12, 40, .28);
        }
        .top-crest { width: 48px; height: 56px; object-fit: contain; background: #fff; border-radius: 10px; padding: 4px; flex: 0 0 auto; }
        .top-title { flex: 1 1 200px; min-width: 0; }
        .top-title h1 { font-size: 22px; line-height: 1.15; font-weight: 800; letter-spacing: -.01em; text-transform: uppercase; }
        .top-title p { margin-top: 2px; font-size: 13.5px; opacity: .85; }
        .top-name-short { display: none; }
        #comicios-short { display: none; }
        .top-match {
            flex: 1 1 100%; min-width: 0; order: 4;
            display: flex; justify-content: center; align-items: stretch; gap: 8px;
        }
        .top-date { flex: 0 1 auto; margin-left: auto; text-align: right; font-size: 13.5px; line-height: 1.3; }
        .top-date strong { display: block; font-size: 14.5px; }
        .top-date span { opacity: .85; }
        @media (min-width: 980px) {
            .top-title { flex: 0 1 auto; max-width: 42%; }
            .top-match { flex: 1 1 220px; order: 0; }
            .top-date { flex: 0 0 auto; margin-left: 0; }
        }

        .hm {
            display: flex; flex-direction: column; justify-content: center; gap: 2px;
            min-width: 0; flex: 0 1 auto;
            padding: 4px 10px;
            border: 1px solid rgba(255, 255, 255, .42);
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            line-height: 1.2;
        }
        a.hm:hover { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .78); }
        .hm-k {
            display: flex; align-items: center; gap: 6px;
            min-width: 0;
            font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
            color: rgba(255, 255, 255, .72);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .hm.live .hm-k { color: #fff; }
        .hm-dot {
            width: 7px; height: 7px; flex: 0 0 auto;
            border: 1.5px solid #fff; border-radius: 50%;
            animation: mtPulse 1.6s ease-in-out infinite;
        }
        @keyframes mtPulse { 0%, 100% { opacity: 1; } 50% { opacity: .28; } }
        .hm-line {
            font-size: 13px; font-weight: 650;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .hm-line b { font-weight: 800; }
        .hm-sc { font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
        .hm-pen { font-size: 11px; font-weight: 650; opacity: .75; }

        .flow { padding: 20px 24px 8px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; width: 100%; }
        .flow > *, #candidates-grid { scroll-margin-top: 88px; }

        /* Tarjetas base */
        .card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(0, 30, 90, .08);
        }
        .sec { padding: 18px 20px; }
        .sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
        .sec-head h2 { flex: 1 1 auto; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; color: var(--blue); letter-spacing: .01em; text-transform: uppercase; }
        .sec-head .meta { color: var(--muted); font-size: 14px; white-space: nowrap; }

        /* Botones */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 9px 15px;
            border-radius: 10px;
            border: 1px solid rgba(0, 61, 165, .3);
            background: #fff;
            color: var(--blue);
            font-weight: 650;
            font-size: 15px;
            cursor: pointer;
            transition: background .15s, color .15s, border-color .15s;
        }
        .btn:hover { background: #eaf2fd; }
        .btn.active, .btn.solid { background: var(--blue); color: #fff; border-color: var(--blue); }
        .btn.solid:hover { background: #0a4cc2; }
        .btn.small { padding: 6px 11px; font-size: 13px; }
        .btn.on-blue { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .7); }
        .btn.on-blue:hover { background: rgba(255, 255, 255, .14); }
        .btn:focus-visible, .cd-name:focus-visible, .cd-all:focus-visible, .cd-mini:focus-visible { outline: 3px solid var(--blue-soft); outline-offset: 2px; }

        /* Comparación por tema */
        .cmp { padding: 16px 20px; display: grid; gap: 12px; justify-items: center; text-align: center; }
        .cmp-focus { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; }
        .cmp-focus p { font-size: 17px; font-weight: 650; color: var(--ink); }

        .topic-bar {
            display: flex; justify-content: center;
            padding: 8px 10px;
        }
        .topic-btns {
            display: flex; flex-wrap: nowrap; align-items: stretch;
            width: 100%; gap: 8px;
            overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
        }
        .topic-btns::-webkit-scrollbar { display: none; }
        .topic-btns .btn {
            flex: 1 1 0; min-width: 0;
            white-space: nowrap;
        }
        .topic-btns .btn .ic { width: 1.15em; height: 1.15em; flex: 0 0 auto; }

        /* Candidaturas que se bajaron */
        .drops { padding: 12px 20px; font-size: 15px; line-height: 1.5; color: var(--muted); }
        .drops p + p { margin-top: 4px; }
        .drops strong { color: var(--ink); }

        /* Candidatos: una columna por persona, alineadas al tema elegido arriba */
        .cd-grid {
            display: grid; gap: 18px;
            grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr));
            align-items: stretch;
        }
        .cd-card {
            display: flex; flex-direction: column; overflow: hidden;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .tc-card { cursor: default; }
        .cd-head { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--blue); color: #fff; }
        .cd-photo { width: 72px; height: 72px; border-radius: 14px; object-fit: cover; flex: 0 0 auto; background: #fff; }
        .cd-id { min-width: 0; flex: 1 1 auto; }
        .cd-role { display: inline-block; padding: 1px 10px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .7); font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
        .cd-id h3 { margin-top: 4px; font-size: 21px; line-height: 1.15; font-weight: 750; }
        .cd-name {
            display: inline; margin: 0; padding: 0; border: 0; background: none;
            color: inherit; font: inherit; font-weight: inherit; cursor: pointer; text-align: left;
            text-decoration: none;
        }
        .cd-name:hover { opacity: .82; }
        .cd-group { display: flex; align-items: center; gap: 7px; margin-top: 4px; font-size: 15px; opacity: .92; }
        .cd-group img { width: 22px; height: 22px; object-fit: contain; background: #fff; border-radius: 6px; padding: 1px; flex: 0 0 auto; }
        .cd-all {
            display: block; margin: 7px 0 0; padding: 0; border: 0; background: none;
            color: inherit; font-size: 13px; font-weight: 650; cursor: pointer; text-align: left;
            text-decoration: none; opacity: .82; white-space: nowrap;
        }
        .cd-all:hover { opacity: 1; }
        .cd-body { flex: 1 1 auto; padding: 16px 16px 6px; }
        .cd-kicker { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); }
        .cd-item { padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
        .cd-item:last-child { border-bottom: 0; margin-bottom: 4px; }
        .cd-item.cd-new { background: #eef5ff; border-radius: 8px; padding: 8px; margin-left: -8px; margin-right: -8px; }
        .cd-sum { font-size: 16px; line-height: 1.45; }
        .tc-card .cd-sum { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
        .cd-src { margin-top: 6px; font-size: 14px; line-height: 1.35; color: var(--muted); }
        a.source-link { color: var(--blue); font-weight: 650; text-decoration: none; }
        a.source-link:hover { color: #0a4cc2; }
        a.source-link .ic { width: .95em; height: .95em; }
        .cd-age { color: #9a6a00; font-weight: 650; }
        .cd-auto { margin-left: 6px; padding: 0 7px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted); }
        .cd-empty { margin: 2px 0 12px; font-size: 15px; line-height: 1.45; color: var(--muted); font-style: italic; }
        .cd-notes:empty { display: none; }
        .cd-notes { padding: 12px 16px; border-top: 1px solid var(--line); }
        .cd-note { display: block; margin-bottom: 6px; padding: 8px 10px; border-radius: 10px; background: var(--wash); font-size: 14px; line-height: 1.35; text-decoration: none; }
        .cd-note:hover { background: #e4eefb; }
        .cd-note strong { color: var(--blue); margin-right: 4px; }
        .cd-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 16px 16px; margin-top: auto; }
        .cd-social { display: flex; gap: 12px; flex-wrap: wrap; font-size: 14px; }

        /* Candidato abierto: el resto queda minimizado */
        .cd-grid.is-focus { grid-template-columns: minmax(0, 1fr); }
        .cd-card { min-width: 0; }
        .cd-minis { display: flex; flex-wrap: wrap; gap: 10px; }
        .cd-mini {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 14px 6px 6px;
            background: #fff; color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 12px; cursor: pointer;
            transition: background .15s;
        }
        .cd-mini:hover { background: #eaf2fd; }
        .cd-mini img { width: 38px; height: 38px; border-radius: 9px; object-fit: cover; }
        .cd-mini span { display: block; font-weight: 700; font-size: 15px; line-height: 1.15; text-align: left; }
        .cd-mini small { display: block; font-size: 12.5px; color: var(--muted); text-align: left; }
        .cd-full .cd-photo { width: 92px; height: 92px; }
        .cd-full .cd-id h3 { font-size: 26px; }
        /* Las posturas se reparten en columnas parejas (la cantidad la calcula layoutTopics): nunca queda una sola suelta en una fila nueva. */
        .cd-topics { --cols: 1; display: flex; flex-wrap: wrap; gap: 4px 28px; padding: 18px 20px 6px; }
        .cd-topics > .cd-empty { flex: 1 1 100%; }
        .cd-topic { flex: 1 1 calc((100% - (var(--cols) - 1) * 28px) / var(--cols) - 1px); min-width: 0; padding-bottom: 12px; }
        .cd-topic .cd-empty { margin-bottom: 4px; }
        .cd-full .cd-notes { display: block; }
        .cd-full .cd-notes:empty { display: none; }

        /* Cómo votar */
        .vote-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
        .vote-item { padding: 12px 14px; border-radius: 12px; background: var(--wash); }
        .vote-item strong { display: block; margin-bottom: 2px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); }
        .vote-src { margin-top: 12px; font-size: 14px; color: var(--muted); }

        /* Carrusel de noticias */
        .feed-nav { display: flex; gap: 6px; }
        .feed-nav button {
            width: 36px; height: 36px; display: grid; place-items: center;
            border-radius: 50%; border: 1px solid rgba(0, 61, 165, .3);
            background: #fff; color: var(--blue); cursor: pointer;
            transition: background .15s, color .15s;
        }
        .feed-nav button:hover { background: var(--blue); color: #fff; }
        .feed-empty { padding: 18px 4px; color: var(--muted); }
        .news-track { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 2px 2px 6px; outline: none; }
        .news-track::-webkit-scrollbar { display: none; }
        .news-item {
            flex: 0 0 100%; scroll-snap-align: start;
            display: flex; flex-direction: column; gap: 8px; min-height: 200px;
            padding: 16px; border-radius: 14px; background: #fff;
            border: 1px solid var(--line);
            color: var(--ink); text-decoration: none;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }
        .news-item:hover, .news-item:focus-visible { transform: translateY(-3px); border-color: var(--blue-soft); box-shadow: 0 12px 26px rgba(0, 61, 165, .14); }
        @media (min-width: 720px) { .news-item { flex-basis: calc((100% - 14px) / 2); } }
        @media (min-width: 1180px) { .news-item { flex-basis: calc((100% - 28px) / 3); } }
        .news-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--muted); }
        .news-meta strong { color: var(--blue); }
        .news-tags { display: flex; flex-wrap: nowrap; gap: 6px; overflow: hidden; }
        .news-tag { flex: 0 0 auto; white-space: nowrap; padding: 1px 10px; border-radius: 999px; border: 1px solid var(--c, var(--blue)); color: var(--c, var(--blue)); font-size: 12px; font-weight: 700; }
        .news-head { display: flex; align-items: flex-start; gap: 12px; }
        .news-head .news-title { flex: 1 1 auto; min-width: 0; }
        /* Foto de la nota: chica y apagada, recupera color al pasar el mouse. Si no carga, se quita y el título ocupa todo el ancho. */
        .news-thumb {
            flex: 0 0 auto; width: 84px; height: 56px; object-fit: cover; border-radius: 9px;
            display: block; background: var(--wash); opacity: .88; filter: saturate(.75);
            transition: opacity .18s ease, filter .18s ease;
        }
        .news-item:hover .news-thumb, .news-item:focus-visible .news-thumb { opacity: 1; filter: none; }
        .news-title { font-size: 18px; line-height: 1.3; font-weight: 750; color: #0b1c3a; }
        .news-summary { font-size: 15px; line-height: 1.4; color: #3b4d6b; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .news-open { margin-top: auto; padding-top: 6px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--blue); }
        .news-item:hover .news-open { text-decoration: underline; }
        .news-progress { height: 3px; margin-top: 10px; border-radius: 3px; background: var(--line); overflow: hidden; }
        .news-progress span { display: block; height: 100%; width: 0; background: var(--blue); }
        @keyframes newsProgress { from { width: 0; } to { width: 100%; } }

        /* Test */
        .qz-start { text-align: center; padding: 16px 8px; display: grid; gap: 10px; justify-items: center; }
        .qz-start h3 { font-size: 20px; color: #0b1c3a; }
        .qz-start p { max-width: 640px; color: #3b4d6b; }
        .qz-fine { font-size: 14px; color: var(--muted); }
        .qz-shared { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: #fff7e0; border: 1px solid #e6c36a; color: #5b4300; font-size: 15px; }
        .qz-progress { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; font-size: 13px; font-weight: 700; letter-spacing: .05em; color: var(--muted); }
        .qz-bar { width: 160px; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
        .qz-bar > div { height: 100%; background: var(--blue); transition: width .3s ease; }
        #quiz-question-title { margin: 6px 0 14px; font-size: 22px; line-height: 1.3; color: #0b1c3a; }
        .qz-options { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
        .qz-opt { justify-content: flex-start; text-align: left; line-height: 1.4; padding: 12px 14px; font-weight: 550; }
        .qz-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-top: 14px; }
        .qz-actions.center { justify-content: center; }
        .qz-headline { text-align: center; margin-bottom: 14px; color: var(--blue); }
        .qz-headline .ic { width: 38px; height: 38px; stroke-width: 1.4; }
        .qz-headline h3 { margin-top: 4px; font-size: 20px; color: #0b1c3a; }
        .qr-list { display: grid; gap: 10px; max-width: 760px; margin: 0 auto; }
        .qr-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--wash); border: 1px solid var(--line); }
        .qr-row.qr-top { background: #fff; border-color: var(--c); box-shadow: inset 4px 0 0 var(--c); }
        .qr-row.qr-weak { opacity: .78; }
        .qr-photo { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; }
        .qr-name { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
        .qr-name strong { font-size: 17px; color: #0b1c3a; }
        .qr-name span { font-size: 14px; color: var(--muted); }
        .qr-track { height: 8px; margin: 6px 0 4px; border-radius: 8px; background: var(--line); overflow: hidden; }
        .qr-track span { display: block; height: 100%; border-radius: 8px; background: var(--c); transition: width .6s ease; }
        .qr-note { font-size: 13.5px; line-height: 1.35; color: var(--muted); }
        .qr-pct { font-size: 26px; font-weight: 800; color: var(--c); min-width: 64px; text-align: right; }
        .qd { max-width: 760px; margin: 14px auto 0; }
        .qd > summary { cursor: pointer; font-weight: 700; color: var(--blue); padding: 8px 0; }
        .qd-q { padding: 10px 0; border-top: 1px solid var(--line); }
        .qd-q h4 { font-size: 16px; color: #0b1c3a; }
        .qd-pick { margin: 3px 0 6px; font-size: 14px; color: var(--muted); }
        .qd-q ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
        .qd-q li { font-size: 14.5px; line-height: 1.4; }
        .qd-q li.qd-none { color: #7a889d; }
        .qd-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
        .qd-match { color: #0a7a3d; font-style: normal; font-weight: 700; }
        .qd-partial { color: #9a6a00; font-style: normal; font-weight: 700; }
        .qd-miss { color: #b3261e; font-style: normal; font-weight: 700; }

        /* Sondeos */
        .polls-body { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .poll-card { padding: 14px 16px; border-radius: 14px; background: #fff; border: 1px solid var(--line); }
        .poll-card-head { margin-bottom: 10px; }
        .poll-card-head strong { display: block; font-size: 18px; color: #0b1c3a; }
        .poll-card-head span { font-size: 14px; color: var(--muted); }
