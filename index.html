    <script>
        const BOOT = window.VELEZ_DATA || {};
        const LIVE_MS = 60000;
        const BA = "America/Argentina/Buenos_Aires";
        const QUIZ_KEY = "velez-comicios-2026-quiz-v2";
        const SKIP = "_skip";
        const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const NEWS_TICK_MS = 5000;

        // Todo lo que se dibuja sale de data/candidates.json y data/quiz.json.
        const DATA = { candidates: [], withdrawn: [], topics: [], election: {}, quiz: { enabled: false, questions: [], minCoverage: 3 } };
        let byId = {};
        let candSig = "";
        let quizSig = "";
        let booted = false;
        const DEFAULT_TOPIC = "formula";
        let focusId = null;
        let topicId = DEFAULT_TOPIC;
        const seenItems = new Set();
        let newKeys = new Set();
        let refreshLock = false;
        let newsItems = [];
        let newsSignature = "";
        let pollsSignature = "";
        let lastNews = null;
        let lastPolls = null;
        let newsTimer = null;
        let newsHold = false;
        let quizIndex = 0;
        let quizState = { answers: {}, done: false };
        let lastResult = null;

        function esc(value) {
            return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
        }

        function ic(name) { return '<svg class="ic" aria-hidden="true"><use href="#i-' + esc(name) + '"/></svg>'; }
        function isUrl(value) { return /^https?:\/\//i.test(String(value || "")); }

        function toast(message) {
            const el = document.getElementById("toast");
            el.textContent = message;
            el.classList.add("show");
            clearTimeout(toast._t);
            toast._t = setTimeout(() => el.classList.remove("show"), 2800);
        }

        function dataUrl(file) { return new URL("data/" + file, new URL(".", location.href)).href; }

        async function fetchJson(file) {
            const response = await fetch(dataUrl(file) + "?t=" + Date.now(), { cache: "no-store" });
            if (!response.ok) throw new Error(String(response.status));
            return response.json();
        }

        function toDate(value) {
            if (!value) return null;
            const date = new Date(String(value).length === 10 ? value + "T12:00:00-03:00" : value);
            return Number.isNaN(date.getTime()) ? null : date;
        }

        function dayKey(date) { return new Intl.DateTimeFormat("en-CA", { timeZone: BA }).format(date); }

        function shortDate(value) {
            const date = toDate(value);
            if (!date) return "";
            return new Intl.DateTimeFormat("es-AR", { day: "numeric", month: "short", year: "numeric", timeZone: BA }).format(date).replace(/\./g, "");
        }

        function monthsAgo(value) {
            const date = toDate(value);
            return date ? Math.floor((Date.now() - date.getTime()) / (30.4 * 86400000)) : 0;
        }

        function relativeDay(iso) {
            const date = toDate(iso);
            if (!date) return "";
            const diff = Math.round((new Date(dayKey(new Date())) - new Date(dayKey(date))) / 86400000);
            if (diff <= 0) return "Hoy";
            if (diff === 1) return "Ayer";
            return new Intl.DateTimeFormat("es-AR", { day: "numeric", month: "short", timeZone: BA }).format(date).replace(".", "");
        }

        function checkedLabel(iso) {
            const date = toDate(iso);
            if (!date) return "";
            const when = new Intl.DateTimeFormat("es-AR", { hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: BA }).format(date);
            return "Revisado " + relativeDay(iso).toLowerCase() + ", " + when;
        }

        // -------------------------------------------------------------
        // CANDIDATOS
        // -------------------------------------------------------------
        function validCandidate(c) { return c && typeof c.id === "string" && c.id && c.name && c.status !== "withdrawn"; }
        function colorOf(c) { return (c && /^#[0-9a-f]{3,8}$/i.test(c.color || "")) ? c.color : "#003da5"; }
        function shortOf(c) { return c.short || c.name; }
        function photoOf(c) { return c.photo || "img/escudo-velez.svg"; }
        function posStyle(c) { return c.photoPosition ? ' style="object-position:' + esc(c.photoPosition) + '"' : ""; }

        function setCandidates(payload) {
            const list = payload && Array.isArray(payload.candidates) ? payload.candidates.filter(validCandidate) : [];
            if (!list.length) return false;
            const signature = JSON.stringify(payload);
            if (signature === candSig) return false;
            const first = candSig === "";
            candSig = signature;
            DATA.candidates = list;
            DATA.withdrawn = (payload.candidates || []).filter((c) => c && c.id && c.name && c.status === "withdrawn");
            DATA.election = payload.election || {};
            DATA.topics = Array.isArray(payload.topics) && payload.topics.length ? payload.topics : [{ id: "perfil", label: "Perfiles", icon: "user" }];
            byId = {};
            list.forEach((c) => { byId[c.id] = c; });
            markNewItems(list);
            if (focusId && !byId[focusId]) focusId = null;
            if (!topicId || !DATA.topics.some((t) => t.id === topicId)) topicId = defaultTopicId();
            renderTopicBar();
            renderGrid();
            renderDrops();
            renderVoteInfo();
            paintCalendar();
            renderQuizIntro();
            if (lastNews) { newsSignature = ""; setNews(lastNews); }
            if (lastPolls) { pollsSignature = ""; setPolls(lastPolls); }
            if (DATA.quiz.enabled && !document.getElementById("quiz-results").classList.contains("hidden")) showResults(false);
            return !first;
        }

        function itemKey(id, topic, item) { return [id, topic, item.url, item.summary].join("|"); }

        // Marca como nuevo lo que no estaba en la lectura anterior (la primera lectura no marca nada).
        function markNewItems(list) {
            const before = new Set(seenItems);
            seenItems.clear();
            list.forEach((c) => Object.keys(c.positions || {}).forEach((topic) =>
                (c.positions[topic] || []).forEach((item) => seenItems.add(itemKey(c.id, topic, item)))));
            newKeys = before.size ? new Set(Array.from(seenItems).filter((key) => !before.has(key))) : new Set();
        }

        function sortedItems(items) {
            return (items || []).filter((item) => item && item.summary && isUrl(item.url))
                .map((item, index) => ({ item, index }))
                .sort((a, b) => {
                    const da = toDate(a.item.date); const db = toDate(b.item.date);
                    if (da && db) return db - da || a.index - b.index;
                    if (da) return -1;
                    if (db) return 1;
                    return a.index - b.index;
                }).map((entry) => entry.item);
        }

        function itemHtml(c, topic, item) {
            const when = shortDate(item.date);
            const old = item.date && monthsAgo(item.date) >= 3 ? ' <span class="cd-age">· hace ' + monthsAgo(item.date) + " meses</span>" : "";
            const auto = item.auto ? '<span class="cd-auto" title="Resumen generado automáticamente a partir de la nota. Verificalo en la fuente.">automático</span>' : "";
            return '<div class="cd-item' + (newKeys.has(itemKey(c.id, topic, item)) ? " cd-new" : "") + '"><p class="cd-sum">' + esc(item.summary) + "</p>" +
                '<p class="cd-src"><a class="source-link" href="' + esc(item.url) + '" target="_blank" rel="noopener noreferrer"' +
                (item.quote ? ' title="' + esc("«" + item.quote + "»") + '"' : "") + ">Fuente: " + esc(item.source || "ver la nota") + (when ? " · " + esc(when) : "") +
                " " + ic("external") + "</a>" + old + auto + "</p></div>";
        }

        // Solo se muestran los temas que tienen al menos una postura con fuente; "limit" resume a lo más reciente.
        // Los temas "latestOnly" (la fórmula) muestran solo lo más reciente: si cambia, lo anterior deja de verse.
        function topicBlock(c, topic, limit) {
            const items = sortedItems(c.positions && c.positions[topic.id]);
            if (!items.length) return "";
            const cap = topic.latestOnly ? 1 : (limit || items.length);
            return '<section class="cd-topic"><p class="cd-kicker">' + ic(topic.icon || "user") + esc(topic.label) + "</p>" +
                items.slice(0, cap).map((item) => itemHtml(c, topic.id, item)).join("") + "</section>";
        }

        function socialHtml(c) {
            return (c.social || []).filter((s) => s && isUrl(s.url)).map((s) => {
                const host = (() => { try { return new URL(s.url).hostname; } catch { return ""; } })();
                const icon = /instagram/.test(host) ? "instagram" : /(^|\.)x\.com|twitter/.test(host) ? "x" : "globe";
                return '<a class="source-link" href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer"' + (s.note ? ' title="' + esc(s.note) + '"' : "") + ">" + ic(icon) + " " + esc(s.label || "Redes") + "</a>";
            }).join("");
        }

        function headHtml(c, opts) {
            opts = opts || {};
            const name = opts.open
                ? '<h3><button type="button" class="cd-name" data-focus="' + esc(c.id) + '">' + esc(c.name) + "</button></h3>"
                : "<h3>" + esc(c.name) + "</h3>";
            const more = opts.open
                ? '<button type="button" class="cd-all" data-focus="' + esc(c.id) + '">Ver todas las posturas</button>'
                : "";
            return '<div class="cd-head no-select"><img class="cd-photo" src="' + esc(photoOf(c)) + '" alt="' + esc(c.name) + '"' + posStyle(c) + ">" +
                '<div class="cd-id"><span class="cd-role">' + esc(c.role || "Candidato") + "</span>" + name +
                '<p class="cd-group">' + (c.logo ? '<img src="' + esc(c.logo) + '" alt="">' : "") + esc(c.group || "") + "</p>" +
                more + "</div>" + (opts.extra || "") + "</div>";
        }

        function fullCardHtml(c) {
            return '<article id="col-' + esc(c.id) + '" class="card cd-card cd-full" style="--c:' + colorOf(c) + '">' + headHtml(c) +
                '<div class="cd-topics">' + (DATA.topics.map((t) => topicBlock(c, t)).join("") || '<p class="cd-empty">Todavía no hay posturas publicadas con fuente. Se vuelve a buscar sola.</p>') + "</div>" +
                '<section class="cd-notes" id="cd-notes-' + esc(c.id) + '"></section>' +
                '<div class="cd-foot no-select"><span class="cd-social">' + socialHtml(c) + "</span></div></article>";
        }

        function minisHtml(exceptId) {
            return '<div class="cd-minis no-select">' + DATA.candidates.filter((c) => c.id !== exceptId).map((c) =>
                '<button type="button" class="cd-mini" data-focus="' + esc(c.id) + '" style="--c:' + colorOf(c) + '"><img src="' + esc(photoOf(c)) + '" alt=""' + posStyle(c) + ">" +
                "<div><span>" + esc(shortOf(c)) + "</span><small>" + esc(c.group || "") + "</small></div></button>").join("") + "</div>";
        }

        function renderGrid() {
            const grid = document.getElementById("candidates-grid");
            const focused = focusId && byId[focusId];
            grid.classList.toggle("is-focus", Boolean(focused));
            document.getElementById("sec-compare").classList.toggle("hidden", !focused);
            document.getElementById("focus-name").textContent = focused ? "Estás viendo todo lo de " + focused.name + " (" + (focused.group || "") + ")" : "";
            if (focused) {
                grid.style.removeProperty("--n");
                grid.innerHTML = minisHtml(focusId) + fullCardHtml(focused);
                renderNotes();
                layoutTopics();
                return;
            }
            const topic = DATA.topics.find((t) => t.id === topicId) || DATA.topics[0];
            grid.style.setProperty("--n", String(DATA.candidates.length || 1));
            grid.innerHTML = topic ? DATA.candidates.map((c) => topicCompareCard(c, topic)).join("") : "";
        }

        // Reparte los temas en columnas parejas según el ancho: si entran todos en una fila van todos juntos;
        // si no, se equilibran las filas y la última se estira para no dejar un hueco.
        const TOPIC_MIN = 190;
        const TOPIC_GAP = 28;
        function layoutTopics() {
            document.querySelectorAll(".cd-topics").forEach((box) => {
                const count = box.querySelectorAll(":scope > .cd-topic").length;
                if (!count) return;
                const style = getComputedStyle(box);
                const width = box.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
                const fit = Math.max(1, Math.min(count, Math.floor((width + TOPIC_GAP) / (TOPIC_MIN + TOPIC_GAP))));
                const rows = Math.ceil(count / fit);
                box.style.setProperty("--cols", String(Math.ceil(count / rows)));
            });
        }

        // Candidaturas que se bajaron (por baja o fusión), con la fuente que lo informó.
        function renderDrops() {
            const box = document.getElementById("sec-drops");
            const lines = DATA.withdrawn.filter((c) => c.withdrawal && isUrl(c.withdrawal.url)).map((c) => {
                const w = c.withdrawal;
                const to = w.joins && byId[w.joins] ? " y se suma a la lista de <strong>" + esc(byId[w.joins].name) + "</strong>" : "";
                const when = shortDate(w.date);
                return "<p><strong>" + esc(c.name) + "</strong> bajó su candidatura" + to + ". " +
                    '<a class="source-link" href="' + esc(w.url) + '" target="_blank" rel="noopener noreferrer">Fuente: ' + esc(w.source || "ver la nota") + (when ? " · " + esc(when) : "") + " " + ic("external") + "</a></p>";
            });
            box.classList.toggle("hidden", !lines.length);
            box.innerHTML = lines.join("");
        }

        function renderNotes() {
            DATA.candidates.forEach((c) => {
                const el = document.getElementById("cd-notes-" + c.id);
                if (!el) return;
                const notes = newsItems.filter((n) => (n.tags || []).includes(c.id)).slice(0, 4);
                el.innerHTML = notes.length
                    ? '<p class="cd-kicker">' + ic("megaphone") + "Últimas notas</p>" + notes.map((n) =>
                        '<a class="cd-note" href="' + esc(n.url) + '" target="_blank" rel="noopener noreferrer"><strong>' + esc(n.source) + " · " + esc(relativeDay(n.published)) + "</strong> " + esc(n.title) + "</a>").join("")
                    : "";
            });
        }

        function defaultTopicId() {
            return DATA.topics.some((t) => t.id === DEFAULT_TOPIC) ? DEFAULT_TOPIC : ((DATA.topics[0] && DATA.topics[0].id) || null);
        }

        function focusCandidate(id) {
            if (!byId[id]) return;
            focusId = id;
            renderTopicBar();
            renderGrid();
            document.getElementById("sec-compare").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
        }

        function clearFocus() {
            focusId = null;
            if (!topicId) topicId = defaultTopicId();
            renderTopicBar();
            renderGrid();
            document.getElementById("sec-topics").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
        }

        function renderTopicBar() {
            const bar = document.getElementById("sec-topics");
            const box = document.getElementById("topic-btns");
            const topics = DATA.topics.filter((t) => t && t.id && t.label);
            const open = Boolean(focusId && byId[focusId]);
            bar.classList.toggle("hidden", !topics.length || open);
            if (!topics.length) return;
            box.innerHTML = topics.map((t) => {
                const on = t.id === topicId;
                return '<button type="button" class="btn small' + (on ? " active" : "") + '" data-topic="' + esc(t.id) + '" aria-pressed="' + on + '"' +
                    (on ? ' aria-current="true"' : "") + ' title="' + esc(t.label) + '">' +
                    ic(t.icon || "user") + '<span class="topic-lab"> ' + esc(t.label) + "</span></button>";
            }).join("");
        }

        function topicCompareCard(c, topic) {
            const items = sortedItems(c.positions && c.positions[topic.id]);
            const cap = topic.latestOnly ? 1 : Math.min(2, items.length || 1);
            const body = items.length
                ? items.slice(0, cap).map((item) => itemHtml(c, topic.id, item)).join("")
                : '<p class="cd-empty">Todavía no hay una postura publicada con fuente.</p>';
            return '<article class="card cd-card tc-card" style="--c:' + colorOf(c) + '">' +
                headHtml(c, { open: true }) + '<section class="cd-body">' + body + "</section></article>";
        }

        function setTopicCompare(id) {
            if (!DATA.topics.some((t) => t.id === id)) return;
            topicId = id;
            focusId = null;
            renderTopicBar();
            renderGrid();
        }

        function renderVoteInfo() {
            const info = DATA.election && DATA.election.info;
            const section = document.getElementById("sec-vote");
            const items = info && Array.isArray(info.items) ? info.items.filter((i) => i && i.label && i.text) : [];
            section.classList.toggle("hidden", !items.length);
            if (!items.length) return;
            document.getElementById("vote-body").innerHTML =
                '<div class="vote-grid">' + items.map((i) => '<div class="vote-item"><strong>' + esc(i.label) + "</strong>" + esc(i.text) + "</div>").join("") + "</div>" +
                (isUrl(info.url) ? '<p class="vote-src"><a class="source-link" href="' + esc(info.url) + '" target="_blank" rel="noopener noreferrer">Fuente: ' + esc(info.source || "ver la nota") + (info.date ? " · " + esc(shortDate(info.date)) : "") + " " + ic("external") + "</a></p>" : "");
        }

        function paintCalendar() {
            const now = new Date();
            document.getElementById("cal-day").textContent = new Intl.DateTimeFormat("es-AR", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: BA }).format(now).replace(/^./, (ch) => ch.toUpperCase());
            const election = toDate(DATA.election.date);
            const line = document.getElementById("comicios-line");
            const credit = document.getElementById("site-credit");
            const short = document.getElementById("comicios-short");
            if (!election) { line.textContent = ""; if (short) short.textContent = ""; return; }
            const label = new Intl.DateTimeFormat("es-AR", { day: "numeric", month: "long", timeZone: BA }).format(election);
            const days = Math.ceil((election.getTime() - now.getTime()) / 86400000);
            if (days > 1) { line.textContent = "Faltan " + days + " días para el " + label; if (short) short.textContent = "Faltan " + days + " días"; }
            else if (days === 1) { line.textContent = "Mañana es el " + label; if (short) short.textContent = "Mañana"; }
            else if (days === 0) { line.textContent = "Hoy es el " + label; if (short) short.textContent = "Hoy"; }
            else { line.textContent = "Elecciones del " + label; if (short) short.textContent = label; }
            if (credit) credit.textContent = "Elecciones de Vélez Sarsfield · " + (DATA.election.long || label);
        }

        // -------------------------------------------------------------
        // TEST: preguntas editoriales; las respuestas de cada candidato
        // salen de sus declaraciones con fuente.
        // -------------------------------------------------------------
        function validQuestion(q) {
            return q && q.id && q.title && Array.isArray(q.options) && q.options.length >= 2 && q.options.every((o) => o && o.id && o.text);
        }

        // "enabled": false en data/quiz.json apaga el test (la sección, el resultado compartido y el subtítulo).
        function applyQuizVisibility() {
            const on = DATA.quiz.enabled && DATA.quiz.questions.length > 0;
            document.getElementById("sec-quiz").classList.toggle("hidden", !on);
            document.getElementById("top-sub").textContent = on ? "Candidatos, noticias, sondeos y test del socio" : "Candidatos, noticias y sondeos";
            if (!on) document.getElementById("shared-result").classList.add("hidden");
        }

        function setQuizData(payload) {
            const list = payload && Array.isArray(payload.questions) ? payload.questions.filter(validQuestion) : [];
            if (!list.length) return false;
            const signature = JSON.stringify(payload);
            if (signature === quizSig) return false;
            const wasOn = DATA.quiz.enabled;
            quizSig = signature;
            DATA.quiz = { enabled: payload.enabled !== false, questions: list, minCoverage: Number(payload.minCoverage) > 0 ? Number(payload.minCoverage) : 3 };
            renderQuizIntro();
            applyQuizVisibility();
            if (DATA.quiz.enabled && !wasOn && booted) { restoreQuiz(); showSharedResult(); }
            return true;
        }

        function questions() { return DATA.quiz.questions; }

        function renderQuizIntro() {
            const el = document.getElementById("quiz-intro");
            if (!el) return;
            const n = questions().length;
            el.textContent = n
                ? "Respondé " + n + " preguntas. Comparamos tus respuestas con lo que cada candidato dijo en público, y cada coincidencia lleva el enlace a su fuente."
                : "Estamos preparando las preguntas.";
        }

        function readQuiz() {
            try {
                const saved = JSON.parse(localStorage.getItem(QUIZ_KEY) || "null");
                if (saved && typeof saved.answers === "object" && saved.answers) return saved;
            } catch (err) { /* sin almacenamiento */ }
            return null;
        }

        function writeQuiz() {
            try { localStorage.setItem(QUIZ_KEY, JSON.stringify({ answers: quizState.answers, done: quizState.done, savedAt: Date.now() })); } catch (err) { /* privado */ }
        }

        function showQuizScreen(id) {
            ["quiz-start", "quiz-questions", "quiz-results"].forEach((screen) => document.getElementById(screen).classList.toggle("hidden", screen !== id));
        }

        function firstOpen() {
            const idx = questions().findIndex((q) => !(q.id in quizState.answers));
            return idx === -1 ? questions().length : idx;
        }

        function startQuiz() {
            if (!questions().length) { toast("Todavía no hay preguntas cargadas"); return; }
            quizIndex = firstOpen();
            if (quizIndex >= questions().length) { quizState.done = true; writeQuiz(); showResults(true); return; }
            quizState.done = false;
            showQuizScreen("quiz-questions");
            showQuestion();
        }

        function showQuestion() {
            const qs = questions();
            const q = qs[quizIndex];
            document.getElementById("quiz-progress-text").textContent = "PREGUNTA " + (quizIndex + 1) + " DE " + qs.length;
            document.getElementById("quiz-progress-bar").style.width = ((quizIndex + 1) / qs.length * 100) + "%";
            document.getElementById("quiz-question-title").textContent = q.title;
            document.getElementById("quiz-back").style.visibility = quizIndex > 0 ? "visible" : "hidden";
            const box = document.getElementById("quiz-options");
            box.innerHTML = "";
            q.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "btn qz-opt" + (quizState.answers[q.id] === opt.id ? " active" : "");
                btn.textContent = (index + 1) + ". " + opt.text;
                btn.onclick = () => answer(q.id, opt.id);
                box.appendChild(btn);
            });
        }

        function answer(qid, optionId) {
            quizState.answers[qid] = optionId;
            quizIndex += 1;
            if (quizIndex >= questions().length) {
                quizState.done = true;
                writeQuiz();
                showResults(true);
                return;
            }
            writeQuiz();
            showQuestion();
        }

        function quizSkip() { const q = questions()[quizIndex]; if (q) answer(q.id, SKIP); }

        function quizBack() {
            if (quizIndex <= 0) return;
            quizIndex -= 1;
            showQuestion();
        }

        function scoreQuiz() {
            const answered = questions().filter((q) => {
                const pick = quizState.answers[q.id];
                return pick && pick !== SKIP && q.options.some((o) => o.id === pick);
            });
            const need = DATA.quiz.minCoverage;
            const rows = DATA.candidates.map((c) => {
                let sum = 0; let n = 0;
                const detail = answered.map((q) => {
                    const pick = quizState.answers[q.id];
                    const st = c.stances && c.stances[q.id];
                    if (!st || !isUrl(st.url) || !st.summary) return { q, state: "none" };
                    const score = (st.supports || []).includes(pick) ? 1 : (st.partial || []).includes(pick) ? 0.5 : 0;
                    sum += score; n += 1;
                    return { q, st, state: score === 1 ? "match" : score === 0.5 ? "partial" : "miss" };
                });
                return { c, n, total: answered.length, pct: n ? Math.round(sum / n * 100) : null, ranked: n >= need, detail };
            });
            rows.sort((a, b) => (b.ranked - a.ranked) || ((b.pct ?? -1) - (a.pct ?? -1)));
            return { rows, answered: answered.length, need };
        }

        const STATE_LABEL = { match: "Coincide", partial: "Coincide en parte", miss: "Plantea otra cosa", none: "Sin declaración publicada" };
        const STATE_ICON = { match: "✔", partial: "≈", miss: "✖", none: "–" };

        function rowHtml(r, top) {
            const note = r.pct === null
                ? "Todavía no hay declaraciones publicadas para comparar."
                : r.ranked
                    ? "Se compararon " + r.n + " de tus " + r.total + " respuestas con declaraciones suyas."
                    : "Datos insuficientes: solo " + r.n + " de tus " + r.total + " respuestas se pudieron comparar. No entra en el ranking.";
            return '<div class="qr-row' + (top ? " qr-top" : "") + (r.ranked ? "" : " qr-weak") + '" style="--c:' + colorOf(r.c) + '">' +
                '<img class="qr-photo" src="' + esc(photoOf(r.c)) + '" alt=""' + posStyle(r.c) + ">" +
                '<div><div class="qr-name"><strong>' + esc(r.c.name) + "</strong><span>" + esc(r.c.group || "") + "</span></div>" +
                '<div class="qr-track"><span style="width:' + (r.ranked ? Math.max(3, r.pct) : 0) + '%"></span></div>' +
                '<p class="qr-note">' + esc(note) + "</p></div>" +
                '<div class="qr-pct">' + (r.ranked ? r.pct + "%" : "–") + "</div></div>";
        }

        function detailHtml(result) {
            const answered = questions().filter((q) => result.rows.length && result.rows[0].detail.some((d) => d.q.id === q.id));
            return answered.map((q) => {
                const pick = q.options.find((o) => o.id === quizState.answers[q.id]);
                const lines = result.rows.map((r) => {
                    const d = r.detail.find((x) => x.q.id === q.id);
                    const dot = '<span class="qd-dot" style="background:' + colorOf(r.c) + '"></span>';
                    if (!d || d.state === "none") return '<li class="qd-none">' + dot + "<strong>" + esc(shortOf(r.c)) + ":</strong> sin declaración publicada sobre esto.</li>";
                    return "<li>" + dot + "<strong>" + esc(shortOf(r.c)) + '</strong> <em class="qd-' + d.state + '">' + STATE_ICON[d.state] + " " + STATE_LABEL[d.state] + ".</em> " +
                        esc(d.st.summary) + ' <a class="source-link" href="' + esc(d.st.url) + '" target="_blank" rel="noopener noreferrer">' + esc(d.st.source || "Fuente") + (d.st.date ? " · " + esc(shortDate(d.st.date)) : "") + " " + ic("external") + "</a></li>";
                }).join("");
                return '<div class="qd-q"><h4>' + esc(q.title) + '</h4><p class="qd-pick">Elegiste: ' + esc(pick ? pick.text : "") + "</p><ul>" + lines + "</ul></div>";
            }).join("");
        }

        function showResults(save) {
            showQuizScreen("quiz-results");
            const result = scoreQuiz();
            const ranked = result.rows.filter((r) => r.ranked);
            const bestPct = ranked.length ? ranked[0].pct : null;
            const winners = ranked.filter((r) => r.pct === bestPct);
            let headline;
            if (!result.answered) headline = "Salteaste todas las preguntas, así que no hay nada para comparar.";
            else if (!ranked.length) headline = "Todavía no hay suficientes declaraciones publicadas para armar un ranking con tus respuestas.";
            else if (winners.length > 1) headline = "Empate de afinidad: " + winners.map((w) => w.c.name).join(" y ") + " (" + bestPct + "%).";
            else headline = "Mayor afinidad según lo que dijeron: " + winners[0].c.name + " (" + bestPct + "%).";
            lastResult = ranked.length ? { w: winners[0].c.id, pct: Object.fromEntries(result.rows.filter((r) => r.pct !== null).map((r) => [r.c.id, r.pct])) } : null;
            document.getElementById("quiz-results").innerHTML =
                '<div class="qz-headline">' + ic("trophy") + "<h3>" + esc(headline) + "</h3></div>" +
                '<div class="qr-list">' + result.rows.map((r) => rowHtml(r, winners.includes(r) && ranked.length > 0)).join("") + "</div>" +
                '<p class="qz-fine" style="text-align:center;margin-top:12px">Solo cuentan declaraciones públicas con fuente. Si un candidato no habló de un tema, esa pregunta no suma ni resta. Es una guía, no un consejo de voto.</p>' +
                '<details class="qd"><summary>Ver pregunta por pregunta, con la fuente de cada postura</summary>' + detailHtml(result) + "</details>" +
                '<div class="qz-actions center">' +
                '<button type="button" onclick="shareMyResult()" class="btn solid">' + ic("share") + " Compartir mi resultado</button>" +
                (lastResult ? '<button type="button" onclick="seeWinner()" class="btn">Ver a ' + esc(shortOf(byId[lastResult.w])) + " " + ic("right") + "</button>" : "") +
                "</div>";
            if (save) writeQuiz();
        }

        function seeWinner() { if (lastResult) focusCandidate(lastResult.w); }

        function restoreQuiz() {
            const saved = readQuiz();
            const button = document.getElementById("btn-start-quiz");
            if (!saved) return;
            quizState = { answers: saved.answers || {}, done: Boolean(saved.done) };
            if (!questions().length) return;
            const open = firstOpen();
            if (open >= questions().length && Object.keys(quizState.answers).length) {
                quizState.done = true;
                showResults(false);
                return;
            }
            if (Object.keys(quizState.answers).length) {
                button.textContent = quizState.done ? "Hay preguntas nuevas · continuar (" + (open + 1) + ")" : "Continuar el test (pregunta " + (open + 1) + ")";
            }
        }

        function resetQuiz() {
            try { localStorage.removeItem(QUIZ_KEY); } catch (err) { /* privado */ }
            quizState = { answers: {}, done: false };
            quizIndex = 0;
            lastResult = null;
            document.getElementById("btn-start-quiz").textContent = "Comenzar el test";
            showQuizScreen("quiz-start");
            document.getElementById("quiz-box").scrollIntoView({ behavior: "smooth", block: "center" });
        }

        function shareToken(payload) {
            const json = JSON.stringify(payload);
            const b64 = btoa(unescape(encodeURIComponent(json))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
            const url = new URL(location.href);
            url.hash = "r=" + b64;
            return url.toString();
        }

        function readShareToken() {
            const match = location.hash.match(/r=([A-Za-z0-9_-]+)/);
            if (!match) return null;
            try {
                const b64 = match[1].replace(/-/g, "+").replace(/_/g, "/");
                const padded = b64 + "=".repeat((4 - (b64.length % 4)) % 4);
                return JSON.parse(decodeURIComponent(escape(atob(padded))));
            } catch (err) {
                return null;
            }
        }

        function showSharedResult() {
            const shared = readShareToken();
            const box = document.getElementById("shared-result");
            const other = shared && byId[shared.w];
            if (!other || !shared.pct) { box.classList.add("hidden"); return; }
            const pct = Number(shared.pct[shared.w]);
            const mine = lastResult && byId[lastResult.w];
            const mineLine = mine ? " El tuyo, en este navegador, sigue siendo " + mine.name + "." : " El tuyo se guarda aparte cuando termines las preguntas.";
            box.innerHTML = "<strong>Resultado compartido:</strong> " + esc(other.name) + " (" + esc(other.group || "") + ")" + (Number.isFinite(pct) ? ", " + pct + "% de afinidad" : "") + "." + esc(mineLine);
            box.classList.remove("hidden");
        }

        async function shareMyResult() {
            if (!lastResult) { toast("Todavía no hay un resultado para compartir"); return; }
            const url = shareToken({ v: 2, w: lastResult.w, pct: lastResult.pct });
            const win = byId[lastResult.w];
            const text = "Mi afinidad en las elecciones de Vélez 2026: " + win.name + " (" + (win.group || "") + "). Hacé el test: " + url;
            try {
                if (navigator.share) { await navigator.share({ title: "Test Elecciones Vélez 2026", text, url }); return; }
            } catch (err) {
                if (err && err.name === "AbortError") return;
            }
            try {
                await navigator.clipboard.writeText(text);
                toast("Enlace copiado. Quien lo abra hace su propio test.");
            } catch (err) {
                toast(url);
            }
        }

        // -------------------------------------------------------------
        // PARTIDOS DE VÉLEZ: último resultado, próximo y marcador en vivo.
        // La base es data/matches.json (la guarda la actualización automática con datos de ESPN).
        // Mientras hay un partido por empezar o en juego, el navegador consulta el scoreboard público de ESPN.
        // -------------------------------------------------------------
        const VELEZ_ID = "21";
        const ESPN_API = "https://site.api.espn.com/apis/site/v2/sports/soccer/";
        const MATCH_LIVE_MS = 30000;
        const MATCH_NEAR_MS = 60000;
        const MATCH_IDLE_MS = 600000;
        const matchStore = new Map();
        const matchMisses = new Map();
        let matchHtml = "";
        let matchTimer = null;
        let matchFails = 0;
        let matchBusy = false;
        let matchLast = 0;

        // >>> interpretación de eventos de ESPN: copia exacta en scripts/update-matches.mjs
        const COMPETITIONS = {
          "arg.1": "Liga Profesional",
          "arg.copa": "Copa Argentina",
          "arg.supercopa": "Supercopa Argentina",
          "conmebol.libertadores": "Copa Libertadores",
          "conmebol.sudamericana": "Copa Sudamericana",
          "conmebol.recopa": "Recopa Sudamericana"
        };

        // Fases que ESPN escribe en inglés.
        const ROUNDS = {
          "round of 64": "32avos de final", "round of 32": "16avos de final", "round of 16": "Octavos de final",
          "quarterfinals": "Cuartos de final", "quarterfinal": "Cuartos de final", "semifinals": "Semifinal", "semifinal": "Semifinal",
          "final": "Final", "group stage": "Fase de grupos", "playoffs": "Playoffs"
        };

        // Esta función se repite igual en velez.html (el navegador interpreta los eventos del scoreboard con la misma lógica).
        function normalizeEvent(e, fallbackLeague = "") {
          const comp = e && Array.isArray(e.competitions) ? e.competitions[0] : null;
          if (!comp || !Array.isArray(comp.competitors) || comp.competitors.length !== 2) return null;
          const home = comp.competitors.find((c) => c.homeAway === "home");
          const away = comp.competitors.find((c) => c.homeAway === "away");
          if (!home || !away || !home.team || !away.team) return null;
          const status = comp.status || e.status || {};
          const type = status.type || {};
          const league = (e.league && e.league.slug) || fallbackLeague || "";
          const numberOf = (value) => {
            const raw = value && typeof value === "object" ? (value.value ?? value.displayValue) : value;
            const n = raw === undefined || raw === null || raw === "" ? NaN : Number(raw);
            return Number.isFinite(n) ? n : null;
          };
          const side = (c) => ({
            id: String(c.team.id),
            name: String(c.team.displayName || c.team.name || "").trim(),
            short: String(c.team.shortDisplayName || c.team.displayName || "").trim(),
            logo: c.team.logo || (Array.isArray(c.team.logos) && c.team.logos[0] ? c.team.logos[0].href : "") || "",
            score: numberOf(c.score),
            shootout: numberOf(c.shootoutScore),
            winner: c.winner === true
          });
          const sides = { home: side(home), away: side(away) };
          const shootout = sides.home.shootout !== null || sides.away.shootout !== null;

          // Goles (solo el scoreboard los trae). Si hubo definición por penales, sus remates vienen mezclados con los goles: no se listan.
          const goals = shootout ? [] : (Array.isArray(comp.details) ? comp.details : [])
            .filter((d) => d && d.scoringPlay === true && d.team)
            .map((d) => ({
              team: String(d.team.id),
              player: String((d.athletesInvolved && d.athletesInvolved[0] && (d.athletesInvolved[0].displayName || d.athletesInvolved[0].shortName)) || "").trim(),
              clock: String((d.clock && d.clock.displayValue) || "").trim(),
              penalty: d.penaltyKick === true,
              ownGoal: d.ownGoal === true
            }));

          const roundText = String((e.seasonType && e.seasonType.name) || "").replace(/^torneo\s+/i, "").trim();
          const note = String(comp.altGameNote || (comp.notes && comp.notes[0] && comp.notes[0].headline) || "");
          const roundKey = (note.split(",").pop() || roundText).trim().toLowerCase();
          const stage = ROUNDS[roundKey] || (league === "arg.1" ? roundText : (ROUNDS[roundText.toLowerCase()] || ""));
          const link = (Array.isArray(e.links) ? e.links : []).find((l) => l && /espn\.com\/soccer\/match/i.test(l.href || ""));
          const date = new Date(e.date || comp.date);

          return {
            id: String(e.id),
            league,
            competition: COMPETITIONS[league] || String((e.league && (e.league.shortName || e.league.name)) || "").replace(/^argentine\s+/i, "") || "",
            stage,
            date: Number.isNaN(date.getTime()) ? "" : date.toISOString(),
            state: type.state || "pre",
            status: type.name || "",
            completed: type.completed === true,
            clock: String(status.displayClock || "").trim(),
            venue: String((comp.venue && comp.venue.fullName) || "").trim(),
            url: link ? link.href : "",
            home: sides.home,
            away: sides.away,
            goals
          };
        }
        // <<< fin de la interpretación de eventos de ESPN

        const MATCH_STATUS = {
            STATUS_FULL_TIME: "Final", STATUS_FINAL: "Final", STATUS_FINAL_AET: "Final (alargue)", STATUS_FINAL_PEN: "Final (penales)",
            STATUS_HALFTIME: "Entretiempo", STATUS_END_OF_REGULATION: "Fin del tiempo reglamentario", STATUS_SHOOTOUT: "Penales",
            STATUS_POSTPONED: "Postergado", STATUS_DELAYED: "Demorado", STATUS_RAIN_DELAY: "Demorado", STATUS_SUSPENDED: "Suspendido",
            STATUS_CANCELED: "Cancelado", STATUS_ABANDONED: "Abandonado", STATUS_FORFEIT: "Por reglamento"
        };
        const MATCH_OFF = ["STATUS_POSTPONED", "STATUS_CANCELED", "STATUS_ABANDONED", "STATUS_FORFEIT"];

        function validMatch(m) {
            return Boolean(m && m.id && m.date && !Number.isNaN(Date.parse(m.date)) && m.home && m.away && m.home.id && m.away.id);
        }

        function stateRank(m) { return m.state === "post" ? 2 : m.state === "in" ? 1 : 0; }

        // De cada partido se guarda la versión más avanzada (programado < en juego < terminado); con el mismo avance, la más reciente.
        function mergeMatch(m) {
            const old = matchStore.get(m.id);
            if (!old || stateRank(m) > stateRank(old) || (stateRank(m) === stateRank(old) && (m.fetchedAt || 0) >= (old.fetchedAt || 0))) matchStore.set(m.id, m);
        }

        function setMatches(payload) {
            if (!payload || typeof payload !== "object") return;
            const stamp = Date.parse(payload.checkedAt || payload.updated || "") || 0;
            [payload.last].concat(Array.isArray(payload.upcoming) ? payload.upcoming : []).forEach((m) => {
                if (validMatch(m)) mergeMatch(Object.assign({}, m, { fetchedAt: stamp }));
            });
            renderMatches();
            if (!matchTimer && !matchBusy) scheduleMatchPoll();
        }

        function matchView() {
            const now = Date.now();
            const all = Array.from(matchStore.values());
            const byDate = (a, b) => Date.parse(a.date) - Date.parse(b.date);
            return {
                live: all.filter((m) => m.state === "in" && now - Date.parse(m.date) < 6 * 3600000).sort(byDate)[0] || null,
                last: all.filter((m) => m.state === "post" && m.completed).sort(byDate).pop() || null,
                next: all.filter((m) => m.state === "pre" && Date.parse(m.date) >= now - 4 * 3600000).sort(byDate)[0] || null
            };
        }

        function teamName(side) {
            if (side.id === VELEZ_ID) return "Vélez";
            const raw = String(side.short || side.name || "").replace(/\s*\([^)]*\)\s*/g, " ").replace(/\s+/g, " ").trim();
            return raw || side.short || side.name;
        }

        function matchTime(iso) {
            return new Intl.DateTimeFormat("es-AR", { hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: BA }).format(new Date(iso));
        }

        function scoreLine(m) {
            const pens = m.home.shootout !== null && m.away.shootout !== null
                ? ' <span class="hm-pen">(' + m.home.shootout + "-" + m.away.shootout + ")</span>"
                : "";
            return "<b>" + esc(teamName(m.home)) + '</b> <span class="hm-sc">' + (m.home.score ?? 0) + "–" + (m.away.score ?? 0) + "</span> <b>" + esc(teamName(m.away)) + "</b>" + pens;
        }

        function headerBox(kind, kicker, line, m) {
            const live = kind === "live";
            const tag = isUrl(m.url) ? "a" : "div";
            const href = tag === "a" ? ' href="' + esc(m.url) + '" target="_blank" rel="noopener noreferrer"' : "";
            const eye = live ? '<span class="hm-dot" aria-hidden="true"></span>' : "";
            return "<" + tag + ' class="hm' + (live ? " live" : "") + '"' + href + ">" +
                '<span class="hm-k">' + eye + esc(kicker) + "</span>" +
                '<span class="hm-line">' + line + "</span></" + tag + ">";
        }

        function headerLive(m) {
            return headerBox("live", "En vivo · " + (MATCH_STATUS[m.status] || m.clock || "En juego"), scoreLine(m), m);
        }

        function headerLast(m) {
            return headerBox("last", "Último", scoreLine(m), m);
        }

        function headerNext(m) {
            const other = m.home.id === VELEZ_ID ? m.away : m.home;
            const note = m.status && m.status !== "STATUS_SCHEDULED"
                ? MATCH_STATUS[m.status]
                : new Intl.DateTimeFormat("es-AR", { day: "numeric", month: "numeric", timeZone: BA }).format(new Date(m.date)) + " · " + matchTime(m.date);
            return headerBox("next", "Próximo", "vs " + esc(teamName(other)) + ' <span class="hm-pen">' + esc(note) + "</span>", m);
        }

        function renderMatches() {
            const view = matchView();
            const parts = [];
            if (view.live) parts.push(headerLive(view.live));
            else if (view.last) parts.push(headerLast(view.last));
            if (view.next) parts.push(headerNext(view.next));
            const html = parts.join("");
            const el = document.getElementById("top-match");
            if (html !== matchHtml) { matchHtml = html; el.innerHTML = html; }
            el.classList.toggle("hidden", !parts.length);
        }

        // El partido que hay que seguir de cerca: en juego, por empezar (25 minutos antes) o que debería haber terminado y no se confirmó.
        function matchTracked() {
            const now = Date.now();
            return Array.from(matchStore.values()).filter((m) =>
                m.state !== "post" && m.league && MATCH_OFF.indexOf(m.status) === -1 && (matchMisses.get(m.id) || 0) < 3 &&
                Date.parse(m.date) - now <= 25 * 60000 && now - Date.parse(m.date) <= 36 * 3600000
            ).sort((a, b) => Date.parse(a.date) - Date.parse(b.date))[0] || null;
        }

        function dayCode(date, zone) { return new Intl.DateTimeFormat("en-CA", { timeZone: zone }).format(date).replace(/-/g, ""); }

        async function espnJson(url) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 9000);
            try {
                const response = await fetch(url, { cache: "no-store", signal: controller.signal });
                if (!response.ok) throw new Error(String(response.status));
                return await response.json();
            } finally {
                clearTimeout(timer);
            }
        }

        async function pollMatch(m) {
            const kick = new Date(m.date);
            for (const day of Array.from(new Set([dayCode(kick, BA), dayCode(kick, "UTC")]))) {
                const board = await espnJson(ESPN_API + m.league + "/scoreboard?dates=" + day);
                const found = (board.events || []).find((e) => String(e.id) === m.id);
                const fresh = found && normalizeEvent(found, m.league);
                if (!fresh) continue;
                matchMisses.delete(m.id);
                mergeMatch(Object.assign({}, m, fresh, {
                    stage: fresh.stage || m.stage, venue: fresh.venue || m.venue, url: fresh.url || m.url,
                    competition: fresh.competition || m.competition, fetchedAt: Date.now()
                }));
                return;
            }
            matchMisses.set(m.id, (matchMisses.get(m.id) || 0) + 1);
        }

        function scheduleMatchPoll() {
            clearTimeout(matchTimer);
            const tracked = matchTracked();
            let delay;
            if (tracked) {
                delay = tracked.state === "in" ? MATCH_LIVE_MS : Date.now() - Date.parse(tracked.date) > 4 * 3600000 ? MATCH_IDLE_MS : MATCH_NEAR_MS;
            } else {
                const next = matchView().next;
                delay = Math.min(1800000, Math.max(30000, next ? Date.parse(next.date) - 25 * 60000 - Date.now() : 1800000));
            }
            matchTimer = setTimeout(runMatchPoll, delay * (1 + Math.min(matchFails, 4)));
        }

        async function runMatchPoll() {
            if (matchBusy) return;
            matchBusy = true;
            clearTimeout(matchTimer);
            matchTimer = null;
            try {
                const tracked = matchTracked();
                if (tracked && !document.hidden) {
                    try { await pollMatch(tracked); matchFails = 0; } catch (error) { matchFails += 1; }
                    matchLast = Date.now();
                }
                renderMatches();
            } finally {
                matchBusy = false;
                scheduleMatchPoll();
            }
        }

        function initMatches() {
            document.addEventListener("visibilitychange", () => {
                if (!document.hidden && Date.now() - matchLast > 10000) runMatchPoll();
            });
            setInterval(renderMatches, 30000);
            runMatchPoll();
        }

        // -------------------------------------------------------------
        // NOVEDADES: notas reales, carrusel que avanza solo
        // -------------------------------------------------------------
        function newsCard(item) {
            // Todas las notas llevan una etiqueta (así los títulos quedan alineados): el candidato si la nota es de uno o dos,
            // y "VÉLEZ" cuando no se puede atribuir a uno en particular (sin candidatos o con tres o más).
            const people = (item.tags || []).filter((key) => byId[key]);
            const community = item.kind === "community";
            const labels = [];
            if (community) labels.push('<span class="news-tag">Comunidad de hinchas</span>');
            if (people.length && people.length <= (community ? 1 : 2)) {
                people.forEach((key) => labels.push('<span class="news-tag" style="--c:' + colorOf(byId[key]) + '">' + esc(shortOf(byId[key])) + "</span>"));
            }
            if (!labels.length) labels.push('<span class="news-tag">VÉLEZ</span>');
            // Foto de la nota (miniatura chica que guarda la actualización automática). Si no carga se quita sola.
            const photo = /^https:\/\//i.test(item.image || "")
                ? '<img class="news-thumb" src="' + esc(item.image) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">'
                : "";
            return '<a class="news-item" href="' + esc(item.url) + '" target="_blank" rel="noopener noreferrer">' +
                '<span class="news-meta"><strong>' + esc(item.source) + "</strong><span>" + esc(relativeDay(item.published)) + "</span></span>" +
                '<span class="news-tags">' + labels.join("") + "</span>" +
                '<span class="news-head"><span class="news-title">' + esc(item.title) + "</span>" + photo + "</span>" +
                (item.summary ? '<span class="news-summary">' + esc(item.summary) + "</span>" : "") +
                '<span class="news-open">Leer la nota ' + ic("external") + "</span></a>";
        }

        function setNews(payload) {
            lastNews = payload;
            const items = (payload && Array.isArray(payload.items) ? payload.items : []).filter((item) => item && item.title && isUrl(item.url));
            const checked = document.getElementById("news-checked");
            if (checked) checked.textContent = checkedLabel(payload && (payload.checkedAt || payload.updated));
            renderSources(payload && payload.sources);
            const signature = items.map((item) => item.url + "\t" + (item.image || "")).join("|");
            if (signature === newsSignature) return;
            newsSignature = signature;
            newsItems = items;
            const track = document.getElementById("news-track");
            track.innerHTML = items.length
                ? items.map(newsCard).join("")
                : '<p class="feed-empty">Todavía no hay notas nuevas sobre la elección. Se vuelven a buscar solas.</p>';
            track.scrollLeft = 0;
            restartNewsProgress();
            renderNotes();
        }

        function renderSources(list) {
            const el = document.getElementById("site-sources");
            const sources = (Array.isArray(list) ? list : []).filter((s) => s && s.name && isUrl(s.url));
            el.classList.toggle("hidden", !sources.length);
            el.innerHTML = sources.length
                ? "Dónde buscamos: " + sources.map((s) => '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.name) + "</a>").join(" · ")
                : "";
        }

        function newsStep() {
            const track = document.getElementById("news-track");
            const cards = track.querySelectorAll(".news-item");
            return cards.length > 1 ? cards[1].offsetLeft - cards[0].offsetLeft : track.clientWidth;
        }

        function newsGo(direction) {
            const track = document.getElementById("news-track");
            const step = newsStep();
            const max = track.scrollWidth - track.clientWidth;
            let target = track.scrollLeft + direction * step;
            if (direction > 0 && track.scrollLeft >= max - 4) target = 0;
            else if (direction < 0 && track.scrollLeft <= 4) target = max;
            track.scrollTo({ left: target, behavior: reduceMotion ? "auto" : "smooth" });
            restartNewsProgress();
        }

        function restartNewsProgress() {
            const bar = document.getElementById("news-bar");
            if (!bar) return;
            bar.style.animation = "none";
            void bar.offsetWidth;
            if (!reduceMotion && newsItems.length > 1) bar.style.animation = "newsProgress " + NEWS_TICK_MS + "ms linear forwards";
            clearTimeout(newsTimer);
            if (reduceMotion || newsItems.length < 2) return;
            newsTimer = setTimeout(function tick() {
                if (newsHold || document.hidden) { newsTimer = setTimeout(tick, 600); return; }
                newsGo(1);
            }, NEWS_TICK_MS);
        }

        function initNewsCarousel() {
            const track = document.getElementById("news-track");
            const pause = () => { newsHold = true; const bar = document.getElementById("news-bar"); if (bar) bar.style.animationPlayState = "paused"; };
            const resume = () => { newsHold = false; const bar = document.getElementById("news-bar"); if (bar) bar.style.animationPlayState = "running"; };
            track.addEventListener("mouseenter", pause);
            track.addEventListener("mouseleave", resume);
            track.addEventListener("focusin", pause);
            track.addEventListener("focusout", resume);
            track.addEventListener("touchstart", pause, { passive: true });
            track.addEventListener("touchend", () => setTimeout(resume, 3500), { passive: true });
            document.getElementById("news-prev").addEventListener("click", () => newsGo(-1));
            document.getElementById("news-next").addEventListener("click", () => newsGo(1));
            track.addEventListener("keydown", (event) => {
                if (event.key === "ArrowRight") { event.preventDefault(); newsGo(1); }
                if (event.key === "ArrowLeft") { event.preventDefault(); newsGo(-1); }
            });
        }

        // -------------------------------------------------------------
        // SONDEOS: solo encuestas publicadas, cada una con su enlace
        // -------------------------------------------------------------
        function pollKeys() { return DATA.candidates.map((c) => c.id).concat("indecisos"); }

        function pollLabel(key) {
            if (key === "indecisos") return "Indecisos";
            const c = byId[key];
            return c ? shortOf(c) + (c.group ? " · " + c.group : "") : key;
        }

        function pollColor(key) { return key === "indecisos" ? "#9aa9bb" : colorOf(byId[key]); }

        function validPoll(poll) {
            return poll && poll.pollster && isUrl(poll.url) && poll.results && pollKeys().some((key) => Number.isFinite(Number(poll.results[key])));
        }

        function pollBars(results) {
            const rows = pollKeys().filter((key) => Number.isFinite(Number(results[key])));
            const top = Math.max(1, ...rows.map((key) => Number(results[key])));
            return rows.map((key) => {
                const value = Number(results[key]);
                return '<div class="poll-row"><span class="poll-name">' + esc(pollLabel(key)) + "</span>" +
                    '<span class="poll-track"><span class="poll-fill" style="background:' + pollColor(key) + ";width:" + Math.max(2, value / top * 100) + '%"></span></span>' +
                    '<strong class="poll-value">' + (Math.round(value * 10) / 10) + "%</strong></div>";
            }).join("");
        }

        function pollCard(poll) {
            const details = [poll.field, poll.sample].filter(Boolean).map(esc).join(" · ");
            const host = (() => { try { return new URL(poll.url).hostname.replace(/^www\./, ""); } catch { return "fuente"; } })();
            return '<article class="poll-card"><div class="poll-card-head"><strong>' + esc(poll.pollster) + "</strong>" +
                "<span>" + esc(relativeDay(poll.published)) + (details ? " · " + details : "") + "</span></div>" +
                pollBars(poll.results) +
                '<a class="poll-link" href="' + esc(poll.url) + '" target="_blank" rel="noopener noreferrer">Ver el sondeo en ' + esc(host) + " " + ic("external") + "</a></article>";
        }

        function pollAverage(polls) {
            const out = {};
            pollKeys().forEach((key) => {
                const values = polls.map((poll) => Number(poll.results[key])).filter(Number.isFinite);
                if (values.length === polls.length) out[key] = values.reduce((a, b) => a + b, 0) / values.length;
            });
            return out;
        }

        function setPolls(payload) {
            lastPolls = payload;
            const polls = (payload && Array.isArray(payload.polls) ? payload.polls : []).filter(validPoll)
                .sort((a, b) => new Date(b.published) - new Date(a.published));
            const mentions = (payload && Array.isArray(payload.mentions) ? payload.mentions : []).filter((item) => item && item.title && isUrl(item.url));
            const checked = document.getElementById("polls-checked");
            if (checked) checked.textContent = checkedLabel(payload && (payload.checkedAt || payload.updated));
            const signature = JSON.stringify([polls, mentions]);
            if (signature === pollsSignature) return;
            pollsSignature = signature;
            let html = "";
            if (polls.length) {
                if (polls.length > 1) {
                    html += '<article class="poll-card poll-avg"><div class="poll-card-head"><strong>Promedio de ' + polls.length + ' sondeos</strong><span>Solo las encuestas de abajo</span></div>' + pollBars(pollAverage(polls)) + "</article>";
                }
                html += polls.map(pollCard).join("");
            } else {
                html += '<div class="poll-empty">' + ic("search") + "<div><strong>Todavía no se publicó ninguna encuesta sobre esta elección.</strong>" +
                    "<p>Se buscan sondeos nuevos de forma automática. Cuando aparezca uno con su fuente, se muestra acá con el enlace.</p></div></div>";
            }
            if (mentions.length) {
                html += '<div class="poll-mentions"><h3>Notas que hablan de encuestas</h3>' + mentions.map((item) =>
                    '<a href="' + esc(item.url) + '" target="_blank" rel="noopener noreferrer"><strong>' + esc(item.source) + "</strong> " + esc(item.title) + "</a>").join("") + "</div>";
            }
            document.getElementById("polls-body").innerHTML = html;
        }

        // -------------------------------------------------------------
        // ACTUALIZACIÓN: todo se vuelve a leer cada minuto
        // -------------------------------------------------------------
        async function refreshLive() {
            if (refreshLock) return;
            refreshLock = true;
            let changed = false;
            try {
                const [news, polls, candidates, quiz, matches] = await Promise.allSettled([
                    fetchJson("news.json"), fetchJson("polls.json"), fetchJson("candidates.json"), fetchJson("quiz.json"), fetchJson("matches.json")
                ]);
                if (candidates.status === "fulfilled") changed = setCandidates(candidates.value) || changed;
                if (quiz.status === "fulfilled") setQuizData(quiz.value);
                if (news.status === "fulfilled") setNews(news.value);
                if (polls.status === "fulfilled") setPolls(polls.value);
                if (matches.status === "fulfilled") setMatches(matches.value);
            } finally {
                refreshLock = false;
            }
            if (changed) toast("Se actualizaron los candidatos o sus posturas");
        }

        document.addEventListener("click", (event) => {
            const topic = event.target.closest("[data-topic]");
            if (topic) { event.stopPropagation(); setTopicCompare(topic.dataset.topic); return; }
            const focus = event.target.closest("[data-focus]");
            if (focus) { event.stopPropagation(); focusCandidate(focus.dataset.focus); return; }
            if (event.target.closest("[data-unfocus]")) { clearFocus(); return; }
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && focusId) clearFocus();
        });

        window.onload = function () {
            initNewsCarousel();
            setCandidates(BOOT.candidates);
            setQuizData(BOOT.quiz);
            if (candSig === "") {
                document.getElementById("candidates-grid").innerHTML = '<p class="card sec feed-empty">Estamos cargando los candidatos. Si no aparecen en unos segundos, recargá la página.</p>';
            }
            paintCalendar();
            setNews(BOOT.news || { items: [] });
            setPolls(BOOT.polls || { polls: [], mentions: [] });
            setMatches(BOOT.matches);
            initMatches();
            if (DATA.quiz.enabled) { restoreQuiz(); showSharedResult(); }
            booted = true;
            window.addEventListener("resize", () => requestAnimationFrame(layoutTopics));
            if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(layoutTopics)).observe(document.getElementById("candidates-grid"));
            refreshLive();
            setInterval(refreshLive, LIVE_MS);
        };
    </script>
</body>
</html>
